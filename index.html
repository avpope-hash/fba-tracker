<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FBA Tracker | Refund & MFN Report</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
        }

        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }

        .login-card {
            background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
            border-radius: 32px; padding: 48px 40px; width: 420px; text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .login-card h2 {
            font-size: 2rem; background: linear-gradient(135deg, #f59e0b, #ef4444);
            background-clip: text; -webkit-background-clip: text; color: transparent;
        }
        .login-card .sub { color: #94a3b8; margin-bottom: 24px; font-size: 0.85rem; }
        .login-input {
            width: 100%; padding: 14px 16px; border: 1px solid #334155;
            background: #1e293b; border-radius: 60px; margin-bottom: 16px; color: white;
        }
        .login-input:focus { outline: none; border-color: #f59e0b; }
        .login-btn {
            width: 100%; background: linear-gradient(135deg, #f59e0b, #ea580c);
            padding: 14px; border: none; border-radius: 60px; font-weight: bold;
            cursor: pointer; color: white;
        }

        .main-app { display: none; }
        .app-container { max-width: 1600px; margin: 0 auto; padding: 20px; }

        .nav-bar {
            background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
            border-radius: 60px; padding: 8px 24px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 16px; border: 1px solid rgba(255,255,255,0.1);
        }
        .logo { font-weight: 800; font-size: 1.3rem; background: linear-gradient(135deg, #f59e0b, #ef4444); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .nav-links { display: flex; gap: 8px; }
        .nav-btn {
            background: transparent; border: none; padding: 8px 20px; border-radius: 40px;
            font-weight: 600; cursor: pointer; color: #94a3b8;
        }
        .nav-btn.active { background: #f59e0b; color: #0f172a; }
        .user-info { display: flex; align-items: center; gap: 12px; background: #1e293b; padding: 6px 16px; border-radius: 40px; }
        .user-info span { color: #94a3b8; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 40px; cursor: pointer; }

        .upload-zone {
            background: #1e293b; border: 2px dashed #f59e0b; border-radius: 24px;
            padding: 30px; margin-bottom: 20px; text-align: center; cursor: pointer;
            transition: all 0.2s;
        }
        .upload-zone:hover { background: #334155; border-color: #f59e0b; }
        .upload-zone.drag-over { background: #2d3748; border-color: #10b981; }
        .upload-status {
            background: rgba(255,255,255,0.05); border-radius: 20px; padding: 16px;
            margin-bottom: 20px; max-height: 150px; overflow-y: auto; border: 1px solid #334155;
        }
        .status-item { font-size: 0.75rem; padding: 4px 0; color: #94a3b8; border-bottom: 1px solid #334155; }
        .status-item.success { color: #10b981; }
        .status-item.error { color: #ef4444; }

        .data-status {
            background: #1e293b; border-radius: 16px; padding: 12px; margin-bottom: 16px;
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 12px; border: 1px solid #334155; color: #e2e8f0;
        }
        .status-active { background: #10b981; color: white; padding: 4px 12px; border-radius: 40px; font-size: 0.7rem; }

        .action-bar {
            background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 16px 20px; margin-bottom: 20px;
            display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
            justify-content: flex-start; border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-primary { background: #f59e0b; padding: 10px 20px; border-radius: 40px; border: none; cursor: pointer; font-weight: 600; color: #0f172a; }
        .btn-warning { background: #8b5cf6; color: white; padding: 10px 20px; border-radius: 40px; border: none; cursor: pointer; }
        .btn-success { background: #10b981; color: white; padding: 10px 20px; border-radius: 40px; border: none; cursor: pointer; }
        .btn-danger { background: #ef4444; color: white; padding: 10px 20px; border-radius: 40px; border: none; cursor: pointer; }

        .results-area {
            background: #1e293b; border-radius: 24px; padding: 20px; margin-top: 20px;
            overflow-x: auto; border: 1px solid #334155;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; background: #1e293b; color: #e2e8f0; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #334155; vertical-align: top; color: #e2e8f0; }
        th {
            background: #2d3748; font-weight: 700; position: sticky; top: 0;
            white-space: nowrap; color: #f59e0b;
        }

        .badge-mfn { background: #3b82f6; color: white; padding: 2px 10px; border-radius: 20px; display: inline-block; font-weight: 600; }
        .badge-refunded { background: #10b981; color: white; padding: 2px 10px; border-radius: 20px; display: inline-block; font-weight: 600; }
        .badge-deferred { background: #f59e0b; color: #0f172a; padding: 2px 10px; border-radius: 20px; display: inline-block; font-weight: 600; }
        .badge-mfn-refund { background: #8b5cf6; color: white; padding: 2px 10px; border-radius: 20px; display: inline-block; font-weight: 600; }

        .admin-panel { background: #1e293b; border-radius: 24px; padding: 20px; margin-top: 20px; border: 1px solid #334155; }
        .admin-panel h3, .admin-panel h4 { color: #f59e0b; margin-bottom: 12px; }
        .admin-panel hr { border-color: #334155; margin: 20px 0; }
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #334155; color: #e2e8f0; }
        .admin-panel input, .admin-panel select {
            padding: 8px 12px; border-radius: 40px; border: 1px solid #334155;
            background: #0f172a; color: white; margin-right: 8px; margin-bottom: 8px;
        }
        .admin-panel button {
            background: #f59e0b; padding: 8px 16px; border-radius: 40px; border: none;
            cursor: pointer; font-weight: 600; color: #0f172a; margin-right: 8px;
        }
    </style>
</head>
<body>

<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <h2>🔐 FBA Tracker</h2>
        <div class="sub">Refund & MFN Report Builder</div>
        <input type="text" id="loginEmail" class="login-input" placeholder="Username">
        <input type="password" id="loginPassword" class="login-input" placeholder="Password">
        <button class="login-btn" onclick="attemptLogin()">Sign In →</button>
    </div>
</div>

<div id="mainApp" class="main-app">
    <div class="app-container">
        <div class="nav-bar">
            <div class="logo">📊 FBA Tracker</div>
            <div class="nav-links">
                <button class="nav-btn active" data-view="builder">📋 Report Builder</button>
                <button id="adminBtn" class="nav-btn" style="display:none;">👑 Admin</button>
            </div>
            <div class="user-info">
                <span>👤 <span id="currentUserName">Admin</span></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- Unified Drag & Drop Upload Zone -->
        <div class="upload-zone" id="uploadZone">
            <div style="font-size: 2rem;">📁</div>
            <p>Drag & drop CSV files here or click to upload</p>
            <p style="font-size: 0.7rem; margin-top: 8px;">System automatically detects report type by headers</p>
            <input type="file" id="fileInput" multiple accept=".csv" style="display:none">
        </div>
        <div id="uploadStatus" class="upload-status"></div>

        <!-- Report Builder View -->
        <div id="builderView">
            <div id="dataStatusBar" class="data-status" style="display:none;">
                <span id="dataStatusText"></span>
                <span id="dataStatusBadge" class="status-active">Ready</span>
            </div>

            <div class="action-bar">
                <button id="generateBuilderReportBtn" class="btn-primary">🔍 Generate Report</button>
                <button id="clearBuilderTableBtn" class="btn-warning">🗑️ Clear Table</button>
                <button id="exportBuilderCsvBtn" class="btn-success">📎 Export CSV</button>
            </div>

            <div id="builderResults" class="results-area">
                <div style="color:#94a3b8; text-align:center; padding:40px;">Upload files, then click "Generate Report".</div>
            </div>
        </div>

        <!-- Admin View -->
        <div id="adminView" style="display:none;"></div>
    </div>
</div>

<script>
    // ========== USER MANAGEMENT ==========
    let currentUser = null;
    let isAdmin = false;
    let users = [
        { id: 1, email: 'AP', password: 'pandrei', name: 'Admin', role: 'admin' },
        { id: 2, email: 'rc', password: 'rc', name: 'RC', role: 'user' }
    ];

    function saveUsers() { localStorage.setItem('fba_users', JSON.stringify(users)); }
    function loadUsers() { const s = localStorage.getItem('fba_users'); if (s) users = JSON.parse(s); }
    loadUsers();

    function attemptLogin() {
        const email = document.getElementById('loginEmail').value;
        const pwd = document.getElementById('loginPassword').value;
        const user = users.find(u => u.email === email && u.password === pwd);
        if (user) {
            currentUser = user;
            isAdmin = user.role === 'admin';
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('currentUserName').innerText = user.name;
            if (isAdmin) document.getElementById('adminBtn').style.display = 'inline-block';
            initApp();
        } else {
            alert('Invalid credentials');
        }
    }

    function logout() {
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('adminView').style.display = 'none';
        switchView('builder');
    }

    // ========== REPORT HEADERS FOR DETECTION ==========
    const REPORT_HEADERS = {
        fbaReturns: ["return-date","order-id","sku","asin","fnsku","product-name","quantity","fulfillment-center-id","detailed-disposition","reason","status","license-plate-number","customer-comments"],
        gradeResell: ["date","order-id","value-recovery-type","lpn","manual-order-item-id","merchant-sku","fnsku","asin","quantity","unit-status","reason-for-unit-status","grade-and-resell-used-condition","grade-and-resell-used-merchant-sku","grade-and-resell-used-fnsku"],
        reimbursements: ["approval-date","reimbursement-id","case-id","amazon-order-id","reason","sku","fnsku","asin","product-name","condition","currency-unit","amount-per-unit","amount-total","quantity-reimbursed-cash","quantity-reimbursed-inventory","quantity-reimbursed-total","original-reimbursement-id","original-reimbursement-type"],
        reportsRepo: ["date/time","settlement id","type","order id","sku","description","quantity","marketplace","fulfilment","order city","order state","order postal","tax collection model","product sales","product sales tax","postage credits","shipping credits tax","gift wrap credits","giftwrap credits tax","promotional rebates","promotional rebates tax","marketplace withheld tax","selling fees","fba fees","other transaction fees","other","total","Transaction status","Transaction Release Date"],
        mfn: ["Order ID","Order date","Return request date","Return request status","Amazon RMA ID","Merchant RMA ID","Label type","Label cost","Currency code","Return carrier","Tracking ID","Label to be paid by","A-to-Z Claim","Is prime","ASIN","Merchant SKU","Item name","Return quantity","Return Reason","In policy","Return type","Resolution","Invoice number","Return delivery date","Order amount","Order quantity","SafeT action reason","SafeT claim ID","SafeT claim state","SafeT claim creation time","SafeT claim reimbursement amount","Refunded amount","Category","VAT","Order Item ID"]
    };

    // ========== INDEXEDDB ==========
    const DB_NAME = 'FBATracker';
    const DB_VERSION = 7;
    let db = null;

    let datasets = {
        fbaReturns: [],
        gradeResell: [],
        reimbursements: [],
        reportsRepo: [],
        mfn: []
    };

    let currentBuilderData = [];

    const refundTransactionTypes = ["Refund", "Chargeback Refund", "Refund_Retrocharge"];

    // ---------- helpers ----------
    function formatDate(dateStr) {
        if (!dateStr) return '-';
        try {
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';
            return `${d.getDate().toString().padStart(2,'0')}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getFullYear().toString().slice(-2)}`;
        } catch (e) { return '-'; }
    }

    function initIndexedDB() {
        return new Promise((resolve, reject) => {
            const r = indexedDB.open(DB_NAME, DB_VERSION);
            r.onerror = () => reject(r.error);
            r.onsuccess = () => { db = r.result; loadAllData().then(resolve); };
            r.onupgradeneeded = (e) => {
                const db_ = e.target.result;
                ['removalsBaseData','removalsColumnOrder','returnsReconciliation','rpobReport','inventoryLedger','removalOrder','removalShipment'].forEach(name => {
                    if (db_.objectStoreNames.contains(name)) db_.deleteObjectStore(name);
                });
                Object.keys(REPORT_HEADERS).forEach(storeName => {
                    if (!db_.objectStoreNames.contains(storeName)) db_.createObjectStore(storeName);
                });
            };
        });
    }

    async function saveToDB(storeName, data) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction([storeName], 'readwrite');
            tx.objectStore(storeName).put(data, 'data');
            tx.oncomplete = resolve;
            tx.onerror = () => reject(tx.error);
        });
    }

    async function loadFromDB(storeName) {
        return new Promise((resolve) => {
            const tx = db.transaction([storeName], 'readonly');
            const req = tx.objectStore(storeName).get('data');
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => resolve([]);
        });
    }

    async function loadAllData() {
        for (const reportType of Object.keys(REPORT_HEADERS)) {
            datasets[reportType] = await loadFromDB(reportType);
        }
        updateDataStatusBar();
    }

    async function clearAllData() {
        if (!confirm("⚠️ WARNING: This will delete ALL uploaded data. Are you sure?")) return;
        for (const storeName of Object.keys(REPORT_HEADERS)) {
            await saveToDB(storeName, []);
            datasets[storeName] = [];
        }
        updateDataStatusBar();
        currentBuilderData = [];
        renderBuilderTable();
        alert("All data cleared successfully");
    }

    // ========== PARSER / DETECTION ==========
    function detectReportType(headers) {
        const headerSet = new Set(headers.map(h => h.toLowerCase().trim()));
        for (const [reportType, requiredHeaders] of Object.entries(REPORT_HEADERS)) {
            const matchCount = requiredHeaders.filter(h => headerSet.has(h.toLowerCase().trim())).length;
            if (matchCount >= requiredHeaders.length * 0.7) {
                return reportType;
            }
        }
        return null;
    }

    function parseCSV(text) {
        const lines = [];
        let cur = "", inQ = false;
        for (let i = 0; i < text.length; i++) {
            cur += text[i];
            if (text[i] === '"') inQ = !inQ;
            if (text[i] === '\n' && !inQ) { if (cur.trim()) lines.push(cur.trim()); cur = ""; }
        }
        if (cur.trim()) lines.push(cur.trim());
        if (lines.length < 2) return [];

        const parseLine = (l) => {
            let res = [], curr = "", q = false;
            for (let i = 0; i < l.length; i++) {
                let c = l[i];
                if (c === '"') {
                    if (q && l[i+1] === '"') { curr += '"'; i++; }
                    else q = !q;
                } else if (c === ',' && !q) {
                    res.push(curr.trim()); curr = "";
                } else {
                    curr += c;
                }
            }
            res.push(curr.trim());
            return res.map(v => v.replace(/^"|"$/g, ''));
        };

        const headers = parseLine(lines[0]);
        const result = [];
        for (let i = 1; i < lines.length; i++) {
            const vals = parseLine(lines[i]);
            if (vals.length < 2) continue;
            const obj = {};
            headers.forEach((h, idx) => { obj[h.trim()] = vals[idx] || ""; });
            result.push(obj);
        }
        return result;
    }

    async function processFiles(files) {
        const statusDiv = document.getElementById('uploadStatus');
        for (const file of files) {
            const statusItem = document.createElement('div');
            statusItem.className = 'status-item';
            statusItem.textContent = `Processing: ${file.name}...`;
            statusDiv.prepend(statusItem);

            try {
                const text = await file.text();
                const parsed = parseCSV(text);
                if (parsed.length === 0) throw new Error('No data rows');

                const headers = Object.keys(parsed[0]);
                const reportType = detectReportType(headers);

                if (!reportType) {
                    statusItem.textContent = `❌ ${file.name}: Unknown report type`;
                    statusItem.className = 'status-item error';
                    continue;
                }

                await saveToDB(reportType, parsed);
                datasets[reportType] = parsed;

                statusItem.textContent = `✅ ${file.name}: ${parsed.length} rows - ${reportType}`;
                statusItem.className = 'status-item success';
            } catch (err) {
                statusItem.textContent = `❌ ${file.name}: ${err.message}`;
                statusItem.className = 'status-item error';
            }
        }
        updateDataStatusBar();
    }

    function setupUploadZone() {
        const zone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');

        zone.onclick = () => fileInput.click();
        zone.ondragover = (e) => { e.preventDefault(); zone.classList.add('drag-over'); };
        zone.ondragleave = () => zone.classList.remove('drag-over');
        zone.ondrop = async (e) => {
            e.preventDefault();
            zone.classList.remove('drag-over');
            await processFiles(Array.from(e.dataTransfer.files));
        };
        fileInput.onchange = async (e) => {
            await processFiles(Array.from(e.target.files));
            fileInput.value = '';
        };
    }

    // ========== BUILDER REPORT ==========
    // Final columns (fixed): Order ID, Refund Date, Refund Amount, STATUS
    const FINAL_COLUMNS = ['Order ID', 'Refund Date', 'Refund Amount', 'STATUS'];

    function generateBuilderReport() {
        const returnsData = datasets.fbaReturns || [];
        const gradeData = datasets.gradeResell || [];
        const reimbData = datasets.reimbursements || [];
        const repoData = datasets.reportsRepo || [];
        const mfnData = datasets.mfn || [];

        // --- Sets of Order IDs present in FBA-side reports ---
        const fbaReturnIds = new Set();
        returnsData.forEach(row => {
            const oid = row['order-id']?.toString().trim();
            if (oid) fbaReturnIds.add(oid);
        });

        const gradeIds = new Set();
        gradeData.forEach(row => {
            const oid = row['order-id']?.toString().trim();
            if (oid) gradeIds.add(oid);
        });

        const reimbIds = new Set();
        reimbData.forEach(row => {
            const oid = row['amazon-order-id']?.toString().trim();
            if (oid) reimbIds.add(oid);
        });

        // --- Reports Repository: refund transactions grouped by order id ---
        // Capture refund date, refund amount, AND whether the Transaction status is "Deferred".
        const repoRefundByOrder = new Map(); // orderId -> { refundDate, refundAmount, deferred }
        for (const row of repoData) {
            const oid = row['order id']?.toString().trim();
            const tType = (row['type'] || '').toString().trim();
            if (!oid) continue;
            if (!refundTransactionTypes.includes(tType)) continue;

            const txStatus = (row['Transaction status'] || '').toString().toLowerCase();
            const isDeferred = txStatus.includes('deferred');

            if (!repoRefundByOrder.has(oid)) {
                repoRefundByOrder.set(oid, {
                    refundDate: row['Transaction Release Date'] || '',
                    refundAmount: row['total'] || '',
                    deferred: isDeferred
                });
            } else {
                // If any refund row for this order is Deferred, flag as Deferred.
                const existing = repoRefundByOrder.get(oid);
                if (isDeferred) existing.deferred = true;
            }
        }

        // --- Set of MFN order ids ---
        const mfnIds = new Set();
        for (const row of mfnData) {
            const oid = row['Order ID']?.toString().trim();
            if (oid) mfnIds.add(oid);
        }

        const results = [];
        const emitted = new Set(); // dedupe by Order ID

        // 1) Refund-in-repo rows, excluding any order present in fbaReturns / gradeResell / reimbursements
        for (const [oid, info] of repoRefundByOrder) {
            if (fbaReturnIds.has(oid) || gradeIds.has(oid) || reimbIds.has(oid)) continue;
            if (emitted.has(oid)) continue;
            emitted.add(oid);

            let status;
            if (mfnIds.has(oid)) {
                status = 'MFN Refund';
            } else if (info.deferred) {
                status = 'Deferred';
            } else {
                status = 'Refunded';
            }

            results.push({
                'Order ID': oid,
                'Refund Date': info.refundDate ? formatDate(info.refundDate) : '-',
                'Refund Amount': info.refundAmount || '-',
                'STATUS': status
            });
        }

        // 2) All MFN Order IDs (even if no refund found) — always included.
        for (const oid of mfnIds) {
            if (emitted.has(oid)) continue;
            emitted.add(oid);

            const repoInfo = repoRefundByOrder.get(oid);
            const hasRefund = !!repoInfo;
            results.push({
                'Order ID': oid,
                'Refund Date': repoInfo && repoInfo.refundDate ? formatDate(repoInfo.refundDate) : '-',
                'Refund Amount': repoInfo && repoInfo.refundAmount ? repoInfo.refundAmount : '-',
                'STATUS': hasRefund ? 'MFN Refund' : 'MFN'
            });
        }

        // Sort by Refund Date descending (latest first), then by Order ID
        results.sort((a, b) => {
            const da = a['Refund Date'] === '-' ? '' : a['Refund Date'];
            const db = b['Refund Date'] === '-' ? '' : b['Refund Date'];
            if (da !== db) return db.localeCompare(da);
            return a['Order ID'].localeCompare(b['Order ID']);
        });

        return results;
    }

    function statusBadgeClass(status) {
        if (status === 'MFN') return 'badge-mfn';
        if (status === 'MFN Refund') return 'badge-mfn-refund';
        if (status === 'Deferred') return 'badge-deferred';
        if (status === 'Refunded') return 'badge-refunded';
        return '';
    }

    function renderBuilderTable() {
        const data = currentBuilderData;
        if (!data || data.length === 0) {
            document.getElementById('builderResults').innerHTML =
                '<div style="color:#94a3b8; text-align:center; padding:40px;">No data. Upload files and click "Generate Report".</div>';
            return;
        }

        let html = `<div style="overflow-x:auto;"><table id="builderTable"><thead><tr>`;
        for (const col of FINAL_COLUMNS) {
            html += `<th>${col}</th>`;
        }
        html += `</thead><tbody>`;
        for (const row of data) {
            html += `<tr>`;
            for (const col of FINAL_COLUMNS) {
                const val = row[col] ?? '-';
                if (col === 'STATUS') {
                    const cls = statusBadgeClass(val);
                    html += `<td>${cls ? `<span class="${cls}">${val}</span>` : val}</td>`;
                } else {
                    html += `<td>${val}</td>`;
                }
            }
            html += `</tr>`;
        }
        html += `</tbody></table></div>`;
        document.getElementById('builderResults').innerHTML = html;
    }

    function renderBuilderReport() {
        currentBuilderData = generateBuilderReport();
        renderBuilderTable();
    }

    function clearBuilderTable() {
        currentBuilderData = [];
        renderBuilderTable();
    }

    function exportBuilderCSV() {
        if (!currentBuilderData.length) { alert("Generate report first"); return; }
        const rows = currentBuilderData.map(row =>
            FINAL_COLUMNS.map(h => `"${String(row[h] ?? '-').replace(/"/g, '""')}"`).join(',')
        );
        const csv = [FINAL_COLUMNS.join(','), ...rows].join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `refund_mfn_report_${new Date().toISOString().slice(0,19)}.csv`;
        a.click();
    }

    // ========== DATA STATUS BAR ==========
    function updateDataStatusBar() {
        const bar = document.getElementById('dataStatusBar');
        const text = document.getElementById('dataStatusText');
        const badge = document.getElementById('dataStatusBadge');

        const counts = Object.keys(REPORT_HEADERS).map(k => {
            const len = (datasets[k] || []).length;
            return `${k}: ${len}`;
        });

        const anyLoaded = Object.keys(REPORT_HEADERS).some(k => (datasets[k] || []).length > 0);
        if (!anyLoaded) {
            bar.style.display = 'none';
            return;
        }

        bar.style.display = 'flex';
        text.innerText = counts.join('  |  ');
        badge.innerText = 'Ready';
        badge.className = 'status-active';
    }

    // ========== ADMIN ==========
    function renderAdminPanel() {
        let usersHtml = users.map(u =>
            `<div class="user-row">
                <span><strong>${u.email}</strong> (${u.role})</span>
                <div>${u.id === 1 ? '<span style="color:#666;">Cannot delete</span>' :
                    `<button onclick="deleteUser(${u.id})">Delete</button>`}
                </div>
            </div>`
        ).join('');

        return `<div class="admin-panel">
            <h3>👑 Admin Panel</h3>
            <div>
                <input type="text" id="newUserEmail" placeholder="Username">
                <input type="password" id="newUserPassword" placeholder="Password">
                <select id="newUserRole">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
                <button onclick="addUser()">Add User</button>
            </div>
            <div id="usersList" style="margin-top:16px;">${usersHtml}</div>
            <hr>
            <h4>🗑️ Data Management</h4>
            <button class="btn-danger" onclick="clearAllData()">⚠️ DELETE ALL UPLOADED DATA</button>
        </div>`;
    }

    function addUser() {
        const email = document.getElementById('newUserEmail')?.value;
        const pwd = document.getElementById('newUserPassword')?.value;
        const role = document.getElementById('newUserRole')?.value;
        if (!email || !pwd) { alert("Email and password required"); return; }
        if (users.find(u => u.email === email)) { alert("User exists"); return; }
        users.push({ id: Date.now(), email, password: pwd, name: email.split('@')[0], role });
        saveUsers();
        if (isAdmin) document.getElementById('adminView').innerHTML = renderAdminPanel();
        alert(`User ${email} added`);
    }

    window.deleteUser = function(id) {
        if (id === 1) { alert("Cannot delete main admin"); return; }
        users = users.filter(u => u.id !== id);
        saveUsers();
        if (isAdmin) document.getElementById('adminView').innerHTML = renderAdminPanel();
        alert("User deleted");
    };

    // ========== VIEW SWITCH ==========
    function switchView(view) {
        document.getElementById('builderView').style.display = view === 'builder' ? 'block' : 'none';
        document.getElementById('adminView').style.display = view === 'admin' ? 'block' : 'none';
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        if (view === 'builder') document.querySelector('[data-view="builder"]').classList.add('active');
        else if (view === 'admin') document.getElementById('adminBtn').classList.add('active');
        if (view === 'admin' && isAdmin) document.getElementById('adminView').innerHTML = renderAdminPanel();
    }

    // ========== INIT ==========
    async function initApp() {
        setupUploadZone();
        await initIndexedDB();

        document.getElementById('generateBuilderReportBtn').onclick = renderBuilderReport;
        document.getElementById('clearBuilderTableBtn').onclick = clearBuilderTable;
        document.getElementById('exportBuilderCsvBtn').onclick = exportBuilderCSV;
        document.getElementById('adminBtn').onclick = () => switchView('admin');

        document.querySelectorAll('[data-view]').forEach(btn => {
            btn.addEventListener('click', () => switchView(btn.getAttribute('data-view')));
        });

        setTimeout(() => {
            const anyLoaded = Object.keys(REPORT_HEADERS).some(k => (datasets[k] || []).length > 0);
            if (anyLoaded) renderBuilderReport();
        }, 400);
    }
</script>
</body>
</html>
